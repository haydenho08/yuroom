services:
  db:
    image: postgres:16-alpine
    container_name: yuroom-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yuroom}
      POSTGRES_USER: ${POSTGRES_USER:-yuroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yuroom}
      TZ: America/Toronto
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - yuroom-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The production image against the local database: `docker compose --profile full up --build`.
  # Day-to-day development doesn't need this (gradlew bootRun + npm run dev is faster).
  app:
    profiles: ["full"]
    build: .
    container_name: yuroom-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-yuroom}:${POSTGRES_PASSWORD:-yuroom}@db:5432/${POSTGRES_DB:-yuroom}
      DEMO_DATA: "true"
    ports:
      - "8080:8080"
    mem_limit: 512m   # same as a small hosted instance, so memory problems show up here first

volumes:
  yuroom-db-data:
