services:
  db:
    image: postgres:16-alpine
    container_name: yuroom-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yuroom}
      POSTGRES_USER: ${POSTGRES_USER:-yuroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yuroom}
      TZ: America/Toronto
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - yuroom-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  yuroom-db-data:
